# =====================================================================
# SGP Serfamilia · Servicios de apoyo para desarrollo
#
# PostgreSQL se usa LOCAL (instalado en su equipo), por eso NO está aquí.
# Este compose levanta solo lo que no conviene instalar a mano:
#   - MinIO   (evidencias, ADR-003)  -> API :9000 · consola :9001
#   - Mailpit (SMTP de pruebas)      -> SMTP :1025 · bandeja :8025
#
#   docker compose up -d
#
# Opcional: si prefiere PostgreSQL en contenedor en vez de local:
#   docker compose --profile docker-db up -d     (puerto 5432)
# =====================================================================
name: sgp

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-sgp_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-sgp_minio_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Crea el bucket privado y activa el versionado de objetos (ADR-003, RN-08)
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_USER} $${MINIO_PASS} &&
      mc mb --ignore-existing local/${S3_BUCKET:-evidencias} &&
      mc anonymous set none local/${S3_BUCKET:-evidencias} &&
      mc version enable local/${S3_BUCKET:-evidencias} &&
      echo 'Bucket listo'
      "
    environment:
      MINIO_USER: ${S3_ACCESS_KEY:-sgp_minio}
      MINIO_PASS: ${S3_SECRET_KEY:-sgp_minio_secret}

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  postgres:
    profiles: ["docker-db"]
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER:-sgp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sgp_dev}
      POSTGRES_DB: ${DB_NAME:-sgp}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sgp} -d ${DB_NAME:-sgp}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  minio_data:
  pg_data:
